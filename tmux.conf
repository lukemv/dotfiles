source-file ~/.tmux.reset.conf
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g prefix ^B
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
setw -g mode-keys vi
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Official catppuccin/tmux (v2)
set -g @plugin 'catppuccin/tmux#v2.1.2'

# Flavor: latte | frappe | macchiato | mocha
set -g @catppuccin_flavor 'mocha'

# Window status style — blocky look via full-block separators
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag,(),}"
set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█"
set -g @catppuccin_window_middle_separator "█ "

# Status line separators (match the window blocks)
set -g @catppuccin_status_left_separator  "█"
set -g @catppuccin_status_right_separator "█"

# Status line modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#[fg=#{@thm_blue}] #{b:pane_current_path} "
set -ag status-right "#[fg=#{@thm_yellow}] %H:%M "

# Thin pane borders
set -g pane-border-lines single

# Override pane border format to be empty/minimal
set -g pane-border-format ""

# Vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Quick window management
bind-key t new-window
bind-key y if-shell 'test $(tmux list-panes | wc -l) -gt 1' 'kill-pane' 'kill-window'

# Split panes with | and -
bind-key | split-window -h
bind-key - split-window -v

# Move window left/right with Ctrl+Shift+Arrow (used by QMK TMUX layer)
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

# Prefix-less window navigation (laptop-friendly, mirrors Voyager TMUX layer)
bind-key -n M-, previous-window
bind-key -n M-. next-window
bind-key -n M-< swap-window -d -t -1
bind-key -n M-> swap-window -d -t +1
bind-key -n M-s choose-session
bind-key -n M-y if-shell 'test $(tmux list-panes | wc -l) -gt 1' 'kill-pane' 'kill-window'
bind-key -n M-c new-window

run '~/.tmux/plugins/tpm/tpm'
