onboarding = false
# herdr configuration — mirrors ~/.tmux.conf + ~/.tmux.reset.conf
#
# Keybindings accept an array, so most actions carry the tmux key first and the
# stock herdr key as a fallback. Prefix-less alt+/shift+ bindings mirror the
# laptop-friendly tmux bindings (and the Voyager TMUX layer); if your terminal
# eats them, the prefix form still works.
#
# Validate with:  herdr config check
# Apply with:     herdr server reload-config

[theme]
# tmux: set -g @catppuccin_flavor 'mocha'
name = "catppuccin-mocha"

[terminal]
# Always use PowerShell 7 for new panes; no login-shell probing so panes open fast.
# Pinned to the x64 7.6.x build (Store/MSIX alias). Bare "pwsh.exe" resolves via
# PATH to the older x86 7.5.1 MSI in "Program Files (x86)", which is ~65ms slower.
default_shell = "C:\\Users\\lukem\\AppData\\Local\\Microsoft\\WindowsApps\\pwsh.exe"
shell_mode = "non_login"

# tmux: splits use -c "#{pane_current_path}"
new_cwd = "follow"

[keys]
# tmux: set -g prefix ^B
prefix = "ctrl+b"

# --- Pane focus: vim keys ------------------------------------------------
# tmux: bind-key h/j/k/l select-pane -L/-D/-U/-R
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# --- Splits -------------------------------------------------------------
# tmux: bind | split-window -h   and  bind '"' split-window -h   (side by side)
# herdr calls a side-by-side split "vertical" (vertical divider).
split_vertical = ['prefix+|', 'prefix+"', "prefix+v"]
# tmux: bind - split-window -v   and  bind % split-window -v     (stacked)
split_horizontal = ["prefix+minus", "prefix+%"]

# tmux: bind z resize-pane -Z
zoom = "prefix+z"

# --- Windows / tabs -----------------------------------------------------
# tmux: bind t new-window, bind ^C new-window, bind -n M-c new-window
new_tab = ["prefix+t", "prefix+ctrl+c", "alt+c", "prefix+c"]

# tmux: bind y / bind -n M-y  -> kill-pane, or kill-window on the last pane
close_pane = ["prefix+y", "alt+y", "prefix+x"]
close_tab = "prefix+shift+x"

# tmux: bind -n S-Left/S-Right and bind -n M-,/M-. previous/next-window
previous_tab = ["prefix+p", "shift+left", "alt+comma"]
next_tab = ["prefix+n", "shift+right", "alt+period"]

# tmux: bind 1..9 select-window (default)
switch_tab = "prefix+1..9"

# tmux: bind-key r command-prompt -I "#W" "rename-window '%%'"
# Stock tmux's prefix+, (rename-window) was never unbound in tmux.reset.conf
# (the unbind-key -a there is commented out), so it still works alongside r.
rename_tab = ["prefix+r", "prefix+comma", "prefix+shift+t"]
# Moved off prefix+r so rename-window keeps the tmux key.
resize_mode = "prefix+ctrl+r"

# tmux: bind R source-file ~/.tmux.conf
reload_config = "prefix+shift+r"

# Sidebar stays hidden by default (see [ui] below); this pulls it back on demand.
toggle_sidebar = "prefix+b"

# --- Sessions / workspaces ----------------------------------------------
# tmux: bind S choose-session, bind -n M-s choose-session
workspace_picker = ["prefix+shift+s", "alt+s"]

# tmux: bind w / bind ^W list-windows -> herdr's navigate mode
goto = ["prefix+w", "prefix+g"]

# tmux: bind ^D detach  (plus vanilla prefix+d)
detach = ["prefix+d", "prefix+ctrl+d", "prefix+q"]

# --- Scrollback ---------------------------------------------------------
# tmux: bind -n M-b copy-mode. herdr has no vi copy-mode; edit_scrollback
# opens the buffer in $EDITOR, which is the nearest equivalent.
edit_scrollback = ["prefix+e", "alt+b"]

cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# --- Directional pane swapping ------------------------------------------
# tmux: bind -r H/J/K/L swap-pane in that direction. Not a built-in herdr
# action, so these shell out to the CLI against the focused pane.
[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "herdr pane swap --direction left"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = "herdr pane swap --direction down"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = "herdr pane swap --direction up"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "herdr pane swap --direction right"

[ui]
# =========================================================================
# Reading the screen: tabs are HORIZONTAL, agents are VERTICAL.
#
#   bottom strip  = tabs        (tmux status line: layouts within this space)
#   left sidebar  = spaces + agents  (what is running, and how it is doing)
#   pane borders  = the agent living in that pane
#
# Nothing that describes a tab appears in the sidebar's first line, and
# nothing that describes an agent appears in the bottom strip. If it is
# along the bottom it is a layout; if it is down the side it is a process.
# =========================================================================

# --- Sidebar: the agent dashboard, visible by default --------------------
# Previously collapsed to a rail of bare dots, which is precisely the view
# that makes agents and tabs indistinguishable -- a rail of dots looks like
# a row of tabs turned on its side. Expanded, every entry names itself.
#   prefix+b                -> collapse it back for a full-width terminal
#   prefix+shift+s / alt+s  -> workspace picker (tmux choose-session)
#   prefix+w / prefix+g     -> navigate mode (tmux list-windows)
sidebar_start_collapsed = false
sidebar_collapsed_mode = "compact"
# Wider than the old 26: agent rows now carry a name and a state word.
sidebar_width = 30
sidebar_max_width = 36

# Group agents under the space that owns them instead of ranking them by
# urgency. "priority" reshuffles rows as agents change state, which hides
# the one structural fact worth showing: agents belong to a space, and a
# space contains tabs.
agent_panel_sort = "spaces"

# --- Tabs live along the bottom ------------------------------------------
# NEEDS herdr >= 0.8.0. Older builds log "unknown config key" and ignore
# the four tab_bar_* keys and status_indicators below, along with the
# [theme.custom] surfaces; everything else still applies. Check with
# `herdr --version`, upgrade with `herdr update --handoff`.
#
# The tab row sat at the top, directly against the sidebar's top-left
# corner, so two unrelated lists met at a right angle and read as one
# widget. At the bottom it becomes the tmux status line it always was.
# Prefix, Navigate, Copy, and Resize bars replace it while active.
tab_bar_position = "bottom"

# tmux's status-right. Also a tell that this strip is chrome, not content.
tab_bar_right = [
    { type = "zoom" },
    { type = "hostname" },
    { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

# One tab is not a list, and a one-item list is the most confusable object
# on screen. Hide the strip until a second tab exists.
hide_tab_bar_when_single_tab = true

# --- Panes announce their own agent --------------------------------------
# The strongest cue available: the pane border names the agent inside it,
# so the sidebar entry and the pane are tied together by a shared label
# instead of by position.
show_agent_labels_on_pane_borders = true

# tmux: set -g pane-active-border-style "fg=#fab387,bold" (catppuccin peach).
# Peach is now the focus colour only -- the active pane and the active tab.
# Spaces are mauve and agent state is carried by the state icons, so the
# three layers never share a hue.
accent = "#fab387"

# tmux: set -g pane-border-lines heavy
pane_borders = true
# tmux panes share a single divider rather than sitting in gaps.
pane_gaps = false

# Shape, not just colour. Blocked, working, done, idle, and unknown become
# distinct glyphs, legible at a glance and to colour-blind eyes. Dots all
# look alike, which is half of why a rail of them reads as a tab strip.
status_indicators = "symbols"

# tmux: bind t new-window creates immediately, with no name prompt.
prompt_new_tab_name = false

# tmux: set -g set-clipboard on
copy_on_select = true

# --- Sidebar rows: say the noun out loud ---------------------------------
# Stock layout leads with [icon, workspace, tab], so the first thing an
# agent row says is the name of a tab -- the exact collision to remove.
# These lead with the agent's own name, bold, and its state in words.
# The tab is demoted to a dim third line, where it reads as an address
# rather than a title.
[ui.sidebar.agents]
row_gap = 1
rows = [
    ["state_icon", { token = "agent", bold = true }, { token = "state_text", dim = true }],
    [{ token = "terminal_title_stripped", dim = true }],
    [{ token = "workspace", dim = true }, { token = "tab", dim = true }],
]

# Spaces get their own hue and no state word, so the two panels never look
# like the same kind of list.
[ui.sidebar.spaces]
row_gap = 1
rows = [
    ["state_icon", { token = "workspace", fg = "#cba6f7", bold = true }],
    [{ token = "branch", dim = true }, "git_status"],
]

# --- Surfaces: chrome is darker than content -----------------------------
# The sidebar shared the terminal's background, so the panel had no edge
# and its rows floated next to pane content. Sinking it one step and
# lifting the focused row gives the panel a body.
[theme.custom]
sidebar_bg = "#11111b"
active_row_bg = "#1e1e2e"
selection_bg = "#313244"
# catppuccin-mocha's default subtext0 (#a6adc8) renders inactive tab labels
# too dim to read against the bottom tab strip; brighten it toward white.
subtext0 = "#ffffff"

[advanced]
# tmux: set -g history-limit 1000000 (~50MB of scrollback bytes)
scrollback_limit_bytes = 50000000
